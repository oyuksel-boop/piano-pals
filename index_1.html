<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#A9D8FF">
<title>Piano Pals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FFF6E4; --card:#FFFFFF; --soft:#F3ECFF; --ink:#2A1B4F; --muted:#6D5F8C;
  --line:#E6DAF7; --kbbg:#2A1B4F; --accent:#FF5C7A; --wc:#4D7CFE;
  --good:#23A160; --warn:#E08A00; --bad:#E5484D;
  --font:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#171033;--card:#251A4A;--soft:#30245C;--ink:#F6F0FF;--muted:#B9ABDB;--line:#3C2F6E;--kbbg:#0E0924;}
}
:root[data-theme="dark"]{--bg:#171033;--card:#251A4A;--soft:#30245C;--ink:#F6F0FF;--muted:#B9ABDB;--line:#3C2F6E;--kbbg:#0E0924;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2,h3,p{margin:0}
svg{display:block}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;flex:0 0 auto;position:relative;z-index:5}
.icon-btn{width:52px;height:52px;border-radius:18px;border:0;background:var(--card);display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.icon-btn svg{width:26px;height:26px}
.icon-btn[hidden]{display:none}
.who{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px}
.who .buddy{width:48px;height:48px}
.who .count{display:flex;align-items:center;gap:4px;font-size:18px;color:var(--muted);font-weight:700}
.who .count svg{width:22px;height:22px}
.spacer{flex:1}
.pill{border:0;border-radius:999px;padding:10px 18px 10px 12px;min-height:48px;font-size:17px;font-weight:700;background:var(--card);display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.pill .kbi{width:30px;height:20px;position:relative}
.pill .kbi i{position:absolute;bottom:0;width:6px;height:16px;border-radius:2px;background:#B9ABDB}
.pill.on .kbi i{background:var(--good)}
.pill.on .kbi i.hit{animation:kbhit .3s}
@keyframes kbhit{50%{height:20px;background:#FFC83D}}
.pill.off .kbi i{background:var(--warn)}
.combo{display:none;align-items:center;gap:8px;border-radius:999px;padding:6px 16px 6px 8px;background:var(--card);font-weight:800;font-size:18px;box-shadow:0 3px 0 var(--line)}
body.act .combo{display:flex}
.combo .cn{min-width:40px;height:40px;border-radius:999px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:20px;padding:0 8px}
.combo .cl{color:var(--muted);font-size:16px}

main{flex:1;overflow:auto;position:relative;min-height:0}
.screen{display:none;padding:10px 20px 20px;max-width:1280px;margin:0 auto;min-height:100%}
.screen.on{display:block}
.btn{border:0;border-radius:20px;padding:14px 26px;min-height:56px;font-size:21px;font-weight:800;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.big{font-size:28px;padding:18px 40px;border-radius:26px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{justify-content:center}

/* buddies */
.buddy{display:inline-block;position:relative}
.buddy svg{width:100%;height:100%;overflow:visible;transform-origin:50% 90%;transition:transform .15s ease}
.buddy.live svg{animation:idle 3.2s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px) scale(1.015,.985)}}
.buddy .eyes{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
.buddy.yay svg{animation:yay .65s ease}
@keyframes yay{0%{transform:none}35%{transform:translateY(-22px) rotate(-7deg)}65%{transform:translateY(0) rotate(5deg) scale(1.04,.96)}100%{transform:none}}
.buddy.oops svg{animation:oops .6s ease}
@keyframes oops{25%{transform:rotate(-9deg)}60%{transform:rotate(7deg)}100%{transform:none}}
.buddy.dance svg{animation:dance .45s ease-in-out infinite alternate}
@keyframes dance{from{transform:rotate(-8deg) translateY(0)}to{transform:rotate(8deg) translateY(-10px)}}
.buddy.beatL svg{transform:rotate(calc(var(--amp,1) * -5deg)) translateY(calc(var(--amp,1) * -5px))}
.buddy.beatR svg{transform:rotate(calc(var(--amp,1) * 5deg)) translateY(calc(var(--amp,1) * -5px))}

/* home */
.home{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 20px 30px}
.home-bg{position:fixed;inset:0;z-index:-1;opacity:.55}
.home-bg svg{width:100%;height:100%}
.wordmark{font-size:clamp(60px,10vw,128px);font-weight:800;line-height:1;letter-spacing:-.02em;text-align:center;margin:0 0 8px;filter:drop-shadow(0 4px 0 rgba(42,27,79,.18))}
.wordmark span{display:inline-block;-webkit-text-stroke:3px #fff;paint-order:stroke fill}
.wordmark span:nth-child(odd){transform:translateY(-5px) rotate(-3deg)}
.wordmark span:nth-child(even){transform:translateY(4px) rotate(3deg)}
.tag{text-align:center;color:var(--ink);font-size:24px;font-weight:700;margin-bottom:22px;background:rgba(255,255,255,.75);border-radius:999px;padding:4px 20px}
.profiles{display:flex;gap:28px;flex-wrap:wrap;justify-content:center}
.prof{border:0;background:var(--card);border-radius:40px;padding:22px 26px 20px;width:280px;cursor:pointer;box-shadow:0 8px 0 var(--pc);display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .12s}
.prof:active{transform:translateY(5px);box-shadow:0 3px 0 var(--pc)}
.prof .buddy{width:170px;height:170px}
.prof .nm{font-size:44px;font-weight:800;color:var(--pc);line-height:1.1}
.prof .st{display:flex;align-items:center;gap:6px;font-size:20px;color:var(--muted);font-weight:700}
.prof .st svg{width:24px;height:24px}
.grown{position:fixed;left:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));border:0;background:rgba(255,255,255,.8);color:var(--muted);border-radius:999px;padding:10px 18px;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;touch-action:none}
.grown .ring{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p,0)*1%),#E6DAF7 0)}

/* onboarding */
.ob{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.ob .buddy{width:min(210px,24vh);height:min(210px,24vh)}
.ob h1{font-size:clamp(34px,5vw,56px);line-height:1.1}
.ob p.lead{font-size:24px;color:var(--muted);max-width:620px}
.pressme{font-size:clamp(40px,6vw,72px);font-weight:800;color:var(--accent);animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06)}}
.notepop{font-size:32px;font-weight:800}

/* map */
#scr-map{padding:4px 16px 12px}
.map-wrap{position:relative;width:min(100%, calc((100dvh - 112px) * 16 / 9));aspect-ratio:16/9;margin:0 auto;border-radius:30px;overflow:hidden;box-shadow:0 8px 0 rgba(42,27,79,.12)}
.map-wrap>svg{position:absolute;inset:0;width:100%;height:100%}
.area{position:absolute;transform:translate(-50%,-50%);border:0;border-radius:999px;padding:8px 18px 8px 8px;min-height:54px;background:rgba(255,255,255,.95);color:#2A1B4F;font-weight:800;font-size:clamp(15px,1.55vw,21px);display:flex;align-items:center;gap:8px;box-shadow:0 5px 0 rgba(42,27,79,.28);cursor:pointer;white-space:nowrap;z-index:2}
.area:active{transform:translate(-50%,-46%)}
.area .ic{width:40px;height:40px;border-radius:50%;background:var(--ac);display:grid;place-items:center;flex:0 0 auto}
.area .ic svg{width:24px;height:24px}
.area .as{display:flex;align-items:center;gap:2px;font-size:15px;color:#6D5F8C}
.area .as svg{width:18px;height:18px}
.area.locked{background:rgba(255,255,255,.7);color:#6D5F8C}
.area.locked .ic{background:#B9ABDB}
.mapfx{position:absolute;pointer-events:none;width:22px;height:22px;border-radius:50%;animation:mapfx 1.2s ease-out forwards;z-index:3}
@keyframes mapfx{from{transform:scale(.3);opacity:1}to{transform:translateY(-60px) scale(1.4);opacity:0}}
.advcard{position:absolute;left:1.6%;bottom:3%;z-index:4;border:0;cursor:pointer;background:#fff;color:#2A1B4F;border-radius:30px;padding:12px 20px 12px 12px;display:flex;align-items:center;gap:14px;box-shadow:0 7px 0 rgba(42,27,79,.3);text-align:left;max-width:48%}
.advcard .tart{width:74px;height:74px;border-radius:22px;flex:0 0 auto;display:grid;place-items:center;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 6px,transparent 6px 20px),repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 6px,transparent 6px 20px),var(--accent)}
.advcard .tart svg{width:44px;height:44px}
.advcard h3{font-size:clamp(20px,2.2vw,28px);line-height:1.1}
.advcard .steps{display:flex;gap:6px;margin-top:6px}
.advcard .steps i{width:18px;height:18px;border-radius:50%;background:#E6DAF7}
.advcard .steps i.d{background:var(--good)}
.advcard.go{animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,80%,100%{transform:none}85%{transform:scale(1.05) rotate(-1deg)}90%{transform:scale(1.05) rotate(1deg)}}
.advcard.done{cursor:default}
.mapside{position:absolute;right:1.6%;top:3%;z-index:4;display:flex;gap:10px}
.mapside .icon-btn{width:60px;height:60px;box-shadow:0 5px 0 rgba(42,27,79,.25)}
.mapside .icon-btn svg{width:32px;height:32px}

/* scene animation */
.cloud{animation:drift 60s linear infinite}
.cloud.c2{animation-duration:80s;animation-delay:-30s}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(1800px)}}
.water-flow{stroke-dasharray:18 22;animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-80}}
.nessie-bob{animation:nbob 4s ease-in-out infinite}
@keyframes nbob{50%{transform:translateY(6px)}}
.twinkle{animation:tw 2.6s ease-in-out infinite}
.twinkle.t2{animation-delay:-.9s}.twinkle.t3{animation-delay:-1.7s}
@keyframes tw{50%{opacity:.25}}
.ff{animation:ffly 7s ease-in-out infinite}
.ff.f2{animation-delay:-2s;animation-duration:9s}.ff.f3{animation-delay:-4s;animation-duration:8s}
@keyframes ffly{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(30px,-26px);opacity:1}}
.flag{animation:flag 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left center}
@keyframes flag{to{transform:scaleX(.8) skewY(4deg)}}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(20,10,50,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .panel{background:var(--card);border-radius:34px 34px 0 0;padding:22px 24px calc(24px + env(safe-area-inset-bottom,0px));width:min(100%,1000px);max-height:80%;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.panel-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.panel-head .ic{width:60px;height:60px;border-radius:20px;background:var(--wc);display:grid;place-items:center}
.panel-head .ic svg{width:34px;height:34px}
.panel-head h2{font-size:34px;color:var(--wc);line-height:1.1}
.panel-head p{color:var(--muted);font-size:19px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.act{border:0;border-radius:24px;background:var(--soft);padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:120px}
.act:active{transform:scale(.97)}
.act-num{width:42px;height:42px;border-radius:50%;background:var(--wc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:21px}
.act-title{font-size:21px;font-weight:700;line-height:1.15;margin-top:4px}
.act-stars{display:flex;gap:2px;margin-top:auto}
.act-stars svg{width:24px;height:24px}
.act.locked{opacity:.45;cursor:not-allowed}
.act.locked .act-num{background:var(--muted)}
.asleep{display:flex;align-items:center;gap:18px;font-size:22px}
.asleep .buddy{width:110px;height:110px;flex:0 0 auto}

/* activity shell */
.act-screen.on{display:flex!important;flex-direction:column;height:100%;padding-bottom:8px}
.ltop{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ltop h2{font-size:28px}
.dots{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dots i{width:18px;height:18px;border-radius:50%;background:var(--line)}
.dots i.done{background:var(--accent)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:0;padding:6px 0;border-radius:30px;position:relative;transition:background .6s}
body[data-glow="1"] .stage{background:radial-gradient(ellipse at 50% 60%,rgba(255,200,61,.12),transparent 70%)}
body[data-glow="2"] .stage{background:radial-gradient(ellipse at 50% 60%,rgba(255,200,61,.22),transparent 70%)}
body[data-glow="3"] .stage{background:radial-gradient(ellipse at 50% 60%,rgba(255,200,61,.32),transparent 72%)}
body[data-glow="4"] .stage{background:radial-gradient(ellipse at 50% 60%,rgba(255,140,200,.34),rgba(255,200,61,.2) 45%,transparent 75%)}
.talk{display:flex;align-items:center;gap:10px;align-self:flex-start;min-height:80px}
.talk .buddy{width:84px;height:84px;flex:0 0 auto}
.talk .sb{background:var(--card);border-radius:22px 22px 22px 6px;padding:10px 18px;font-size:22px;font-weight:700;max-width:620px;box-shadow:0 3px 0 var(--line)}
.bubble{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;font-size:92px;font-weight:800;color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.15)}
.bubble.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.say{font-size:26px;font-weight:700;text-align:center}
.staff{width:min(600px,90vw);height:auto;background:var(--card);border-radius:28px;padding:6px}
.staff .ln{stroke:var(--ink);stroke-width:2}
.staff .clef{fill:var(--ink)}
.tog{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{border:0;border-radius:999px;padding:8px 16px;min-height:44px;font-size:17px;font-weight:700;background:var(--card);cursor:pointer;box-shadow:0 3px 0 var(--line)}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:70;pointer-events:none;background:#fff;color:#2A1B4F;border-radius:999px;padding:12px 28px;font-size:30px;font-weight:800;box-shadow:0 6px 0 rgba(42,27,79,.25);display:flex;align-items:center;gap:10px;animation:toast 1.6s ease forwards}
.toast.small{font-size:20px;padding:8px 20px;top:22%}
.toast svg{width:34px;height:34px}
@keyframes toast{0%{opacity:0;transform:translate(-50%,20px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.05)}25%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-20px)}}

/* rhythm */
.rwrap{width:100%;max-width:900px}
.rtrack{position:relative;height:120px;background:var(--card);border-radius:24px;overflow:hidden}
.rgrid{position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.rgrid.rbar{width:4px;background:var(--muted);opacity:.4}
.rblock{position:absolute;top:26px;height:68px;border-radius:16px;background:var(--wc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;border:4px solid transparent}
.rblock.hit{animation:pop .25s}
.rblock.perfect{border-color:var(--good);background:var(--good)}
.rblock.good{border-color:var(--warn);background:var(--warn)}
.rblock.miss{opacity:.4;border:4px dashed var(--bad)}
.playhead{position:absolute;top:0;bottom:0;width:6px;margin-left:-3px;background:var(--accent);border-radius:3px;display:none}
.count{font-size:84px;font-weight:800;height:100px;line-height:100px;color:var(--accent);text-align:center}

/* songs */
.train{width:100%;max-width:980px;overflow:hidden;padding:26px 0;position:relative}
.train-inner{display:flex;align-items:center;gap:10px;padding:0 30px;transition:transform .3s ease;will-change:transform}
.nb{flex:0 0 auto;height:66px;border-radius:33px;display:grid;place-items:center;font-size:30px;font-weight:800;color:#fff;background:var(--c);opacity:.55;transition:transform .2s,opacity .2s}
.nb.dark{color:#2A1B4F}
.nb.now{opacity:1;transform:scale(1.28);box-shadow:0 6px 0 rgba(0,0,0,.18)}
.nb.done{opacity:.2}

/* beat city */
.beat-stage{flex-direction:row;gap:4vw}
.beat-buddy{width:clamp(150px,20vw,240px);height:clamp(150px,20vw,240px)}
.ringbox{position:relative;width:clamp(140px,min(24vw,28vh),260px);aspect-ratio:1;display:grid;place-items:center}
.target{position:absolute;inset:18%;border-radius:50%;background:var(--wc);box-shadow:0 8px 0 rgba(0,0,0,.18);display:grid;place-items:center;color:#fff;font-size:64px;font-weight:800;transition:transform .08s}
.target.bump{transform:scale(1.08)}
.target.freeze{background:#7FD6FF}
.target svg{width:60%;height:60%}
.approach{position:absolute;inset:18%;border-radius:50%;border:7px solid var(--wc);pointer-events:none;z-index:0}
.target{z-index:1}
.approach.freeze{border-style:dashed;border-color:#4DB6E8}
.beatstrip{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:900px}
.beatstrip i{width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-style:normal}
.beatstrip i.x{background:var(--soft);border:3px solid var(--wc)}
.beatstrip i.r{background:#DDF3FF;border:3px dashed #4DB6E8}
.beatstrip i.now{transform:scale(1.3)}
.beatstrip i.ok{background:var(--good);border-color:var(--good)}
.beatstrip i.near{background:var(--warn);border-color:var(--warn)}
.beatstrip i.miss{background:transparent;border-color:var(--bad);border-style:dashed}
.beatstrip i.held{background:#7FD6FF;border-color:#4DB6E8;border-style:solid}
.beatstrip i.broke{background:transparent;border-color:var(--bad)}
.beatword{font-size:34px;font-weight:800;min-height:48px;text-align:center}

/* magic piano */
.magic{flex:1;position:relative;border-radius:30px;overflow:hidden;background:linear-gradient(#1B1446,#3B2A7A 60%,#6A4CB0);min-height:0}
.magic canvas{position:absolute;inset:0;width:100%;height:100%}
.magic .buddy{position:absolute;left:3%;bottom:4%;width:clamp(110px,14vw,170px);height:clamp(110px,14vw,170px)}
.magic .hint{position:absolute;left:0;right:0;top:40%;text-align:center;color:#fff;font-size:34px;font-weight:800;opacity:.9;pointer-events:none;transition:opacity .6s}
.magic .timer{position:absolute;right:3%;top:5%;width:64px;height:64px;border-radius:50%;background:conic-gradient(#FFC83D calc(var(--p,0)*1%),rgba(255,255,255,.2) 0)}

/* keyboard */
.kb-wrap{flex:0 0 auto;height:clamp(150px,31vh,240px);overflow-x:auto;background:var(--kbbg);padding:10px 12px 12px;display:none}
body.kbon .kb-wrap{display:block}
.kb{position:relative;height:100%;min-width:760px}
.key{position:absolute;top:0;border:0;padding:0;cursor:pointer;touch-action:manipulation;transition:background .12s,transform .06s;overflow:visible}
.white{height:100%;background:#fff;border-radius:0 0 12px 12px;box-shadow:inset -2px 0 0 #CFC6E3,inset 0 -6px 0 #E9E3F5}
.black{height:60%;background:#241845;border-radius:0 0 8px 8px;z-index:2;box-shadow:inset 0 -5px 0 #000}
.kl{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-weight:800;font-size:clamp(13px,1.7vw,20px);color:var(--lc)}
body.noletters .kl{display:none}
.mc{position:absolute;bottom:38px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#FF5A5F}

.key.target.white,.key.target.black{background:var(--tc);animation:glow 1s ease-in-out infinite alternate}
.key.target.white .kl{color:#fff}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.18)}}
.key.lit.white{background:var(--lc)}
.key.lit.white .kl{color:#fff}
.key.lit.black{background:#6A4CFF}
.key.good.white,.key.good.black{background:#7BE0A4}
.key.bad.white,.key.bad.black{background:#FFB3B5}
.key.down{transform:translateY(3px)}
.kpop{position:absolute;left:50%;top:18%;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;pointer-events:none;animation:kpop .7s ease-out forwards;z-index:3}
.black .kpop{top:10%;width:26px;height:26px;font-size:13px}
.kpop svg{width:30px;height:30px}
@keyframes kpop{0%{transform:translate(-50%,10px) scale(.4);opacity:0}25%{transform:translate(-50%,0) scale(1.1);opacity:1}100%{transform:translate(-50%,-26px) scale(1);opacity:0}}

/* buddy picker */
.pick h2{font-size:28px;margin:14px 0 10px}
.grid-b{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.opt{border:4px solid transparent;border-radius:28px;background:var(--card);padding:12px 12px 16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.opt .buddy{width:130px;height:130px}
.opt b{font-size:26px;line-height:1.1}
.opt small{font-size:16px;color:var(--muted);line-height:1.25}
.opt[aria-pressed="true"]{border-color:var(--accent)}
.swatches{display:flex;gap:14px;flex-wrap:wrap}
.sw{width:64px;height:64px;border-radius:50%;border:5px solid var(--card);cursor:pointer;box-shadow:0 0 0 2px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 5px var(--ink)}

/* stickers */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px}
.stk{background:var(--card);border-radius:26px;aspect-ratio:1;display:grid;place-items:center;padding:14px}
.stk svg{width:80%;height:80%}
.stk.empty{background:var(--soft);opacity:.6}
.stk.empty svg{opacity:.25;filter:grayscale(1)}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(20,10,50,.55);display:grid;place-items:center;z-index:50;padding:20px}
.overlay[hidden]{display:none}
.card{background:var(--card);border-radius:36px;padding:26px 30px;text-align:center;max-width:520px;width:100%;position:relative;animation:pop .35s ease}
.card .buddy{width:130px;height:130px}
.card h2{font-size:44px;line-height:1.1}
.card p{font-size:20px;color:var(--muted);margin:6px 0 14px}
.bigstars{display:flex;justify-content:center;gap:10px;margin:8px 0}
.bigstars svg{width:66px;height:66px;animation:pop .4s both}
.bigstars svg:nth-child(2){animation-delay:.15s}
.bigstars svg:nth-child(3){animation-delay:.3s}
.summary{display:grid;gap:6px;margin:8px auto 16px;max-width:360px;text-align:left}
.summary div{display:flex;justify-content:space-between;gap:10px;background:var(--soft);border-radius:14px;padding:8px 14px;font-size:19px}
.summary b{color:var(--accent)}
.card .row{justify-content:center}
.stepicon{width:110px;height:110px;margin:0 auto 6px;border-radius:32px;display:grid;place-items:center;background:var(--wc)}
.stepicon svg{width:64px;height:64px}
.advpath{display:flex;justify-content:center;gap:8px;margin:6px 0 12px}
.advpath i{width:22px;height:22px;border-radius:50%;background:var(--line)}
.advpath i.d{background:var(--good)}
.advpath i.c{background:var(--accent);transform:scale(1.25)}
.newstk{width:150px;height:150px;margin:0 auto;animation:spinin .8s ease both}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* ================= audio ================= */
let actx=null,appBus=null,musicBus=null,noiseBuf=null;
function ac(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();appBus=actx.createGain();appBus.connect(actx.destination);musicBus=actx.createGain();musicBus.connect(actx.destination);applyVol();}catch(e){return null;}}
  if(actx.state==='suspended')actx.resume();return actx;}
function applyVol(){if(!actx)return;appBus.gain.value=DB.settings.appVol;musicBus.gain.value=DB.settings.musicVol;}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(m,when,dur,vol,bus){const c=ac();if(!c)return;const t=when||c.currentTime;dur=dur||0.7;vol=vol||0.22;
  const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(vol*0.35,t+0.18);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);g.connect(bus||appBus);
  [['triangle',1,1],['sine',2,0.25],['sine',3,0.08]].forEach(([ty,mul,v])=>{const o=c.createOscillator();o.type=ty;o.frequency.value=mtof(m)*mul;const og=c.createGain();og.gain.value=v;o.connect(og);og.connect(g);o.start(t);o.stop(t+dur+0.05);});}
function chime(){const c=ac();if(!c)return;const t=c.currentTime;tone(84,t,0.25,0.07);tone(91,t+0.07,0.35,0.07);}
function bonk(){const c=ac();if(!c)return;const t=c.currentTime;const o=c.createOscillator();o.type='sine';o.frequency.setValueAtTime(240,t);o.frequency.exponentialRampToValueAtTime(130,t+0.2);const g=c.createGain();g.gain.setValueAtTime(0.12,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);o.connect(g);g.connect(appBus);o.start(t);o.stop(t+0.3);}
function fanfare(){const c=ac();if(!c)return;const t=c.currentTime;[72,76,79,84].forEach((m,i)=>tone(m,t+i*0.11,0.5,0.1));}
function jingle(id){const c=ac();if(!c)return;const t=c.currentTime;(BUDDIES[id]||BUDDIES.coo).jingle.forEach((m,i)=>tone(m,t+i*0.12,0.35,0.12));}
function click(when,accent,bus){const c=ac();if(!c)return;const o=c.createOscillator();o.type='square';o.frequency.value=accent?1600:1100;const g=c.createGain();g.gain.setValueAtTime(accent?0.1:0.06,when);g.gain.exponentialRampToValueAtTime(0.0001,when+0.05);o.connect(g);g.connect(bus||musicBus);o.start(when);o.stop(when+0.06);}
function noise(){const c=ac();if(!noiseBuf){noiseBuf=c.createBuffer(1,Math.floor(c.sampleRate*0.5),c.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}return noiseBuf;}
function drum(type,t,bus){const c=actx;if(!c)return;
  if(type==='kick'){const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+0.12);g.gain.setValueAtTime(0.8,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.3);o.connect(g);g.connect(bus);o.start(t);o.stop(t+0.32);return;}
  if(type==='bass'){return;}
  const s=c.createBufferSource();s.buffer=noise();const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=type==='hat'?7000:1400;const g=c.createGain();
  const v=type==='hat'?0.09:type==='crash'?0.25:0.3;const dcy=type==='hat'?0.05:type==='crash'?1.2:0.16;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+dcy);s.connect(f);f.connect(g);g.connect(bus);s.start(t);s.stop(t+dcy+0.02);}
function bassNote(m,t,dur,bus){const c=actx;const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=mtof(m);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.22,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+0.02);}

function speak(text){const p=P();if(!p||!p.voice||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const v=voices.find(v=>/en[-_]GB/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));if(v)u.voice=v;u.lang='en-GB';u.rate=0.95;u.pitch=1.15;u.volume=Math.min(1,DB.settings.appVol+0.2);speechSynthesis.speak(u);}catch(e){}}

  for(let m=KB.lo;m<=KB.hi;m++){if(!isBlack(m))continue;const i=whites.indexOf(m-1);const k=document.createElement('button');k.className='key black';k.dataset.m=m;
    k.style.left=((i+1)*ww-ww*0.3)+'%';k.style.width=(ww*0.6)+'%';k.setAttribute('aria-label',fullName(m));KB.keys[m]=k;el.appendChild(k);}

function noteOn(m,t,src){ac();lastInput=performance.now();if(src!=='midi')tone(m);
  const k=KB.keys[m];if(k){k.classList.add('down');setTimeout(()=>k.classList.remove('down'),160);}
  if(document.body.classList.contains('kbon'))keyPop(m);

  listeners.forEach(fn=>fn(m,t,src));

function noteOff(m,t){const t0=held[m];delete held[m];if(L&&!L.done&&L.onOff)L.onOff(m,t,t0!=null?t-t0:0);}

function setPill(state){const p=$('#midiPill');p.className='pill '+state;
  $('#midiText').textContent={on:'Keyboard ready',off:'Plug in keyboard',none:'Screen keys only',denied:'Allow keyboard access',idle:'Connect keyboard'}[state]||'Connect keyboard';
  DIAG.state={on:'Connected',off:'No keyboard found',none:'This browser has no MIDI support',denied:'Permission was not given',idle:'Not connected yet'}[state];if(typeof refreshDiag==='function')refreshDiag();}
function onMidi(e){const d=e.data;const cmd=d[0]&0xf0;let t=e.timeStamp;const now=performance.now();if(!t||Math.abs(t-now)>1000)t=now;
  if(cmd===0x90&&d[2]>0){DIAG.last={m:d[1],v:d[2],at:new Date()};DIAG.count++;pillBlink();noteOn(d[1],t,'midi');if(typeof refreshDiag==='function')refreshDiag();}
  else if(cmd===0x80||(cmd===0x90&&d[2]===0)){noteOff(d[1],t);}}
function pillBlink(){const is=$$('#midiPill .kbi i');const i=is[Math.floor(Math.random()*is.length)];if(!i)return;i.classList.remove('hit');void i.offsetWidth;i.classList.add('hit');}
function bind(){const names=[];midi.inputs.forEach(inp=>{inp.onmidimessage=onMidi;names.push(inp.name);});DIAG.devices=names;setPill(names.length?'on':'off');}
async function connectMIDI(){if(!navigator.requestMIDIAccess){setPill('none');return false;}if(midi){bind();return midi.inputs.size>0;}
  try{midi=await navigator.requestMIDIAccess({sysex:false});midi.onstatechange=bind;bind();return midi.inputs.size>0;}catch(e){setPill('denied');return false;}}

/* combo */
const COMBO_LV=[[3,'Little Spark'],[5,'Melody Glow'],[10,'Star Burst'],[20,'Super Performer']];
const Combo={n:0,best:0,
  reset(){this.n=0;this.best=0;this.draw();},
  hit(){this.n++;this.best=Math.max(this.best,this.n);const lv=COMBO_LV.find(l=>l[0]===this.n);
    if(lv){toast(lv[1],false,SPARK);react('yay');if(this.n>=10)confetti();}
    const p=P();if(p&&this.best>p.stats.bestCombo)p.stats.bestCombo=this.best;this.draw();},
  miss(){if(this.n>=3)toast("Combo paused. Let's build it again!",true);this.n=0;this.draw();},
  level(){let l=0;COMBO_LV.forEach((c,i)=>{if(this.n>=c[0])l=i+1;});return l;},
  draw(){$('#comboN').textContent=this.n;const l=this.level();$('#comboL').textContent=l?COMBO_LV[l-1][1]:'Combo';document.body.dataset.glow=l;}};

function good(m,key,msg){flash(m,'good');chime();Combo.hit();statNote(key,true);react('yay');say(msg||buddyLine('yay'));}

/* ================= engines ================= */
const ENGINES={};
ENGINES.hunt=function(S){const d=S.def;const ex=isEx();S.total=S.opts.rounds||(ex?Math.min(8,d.rounds):d.rounds);let tgt=null,wrong=0;
  const letters=S.opts.letters||d.letters;
  function next(){if(S.round>=S.total)return finish(S.total/(S.total+S.mistakes));dots(S.total,S.round);wrong=0;
    if(d.anyOct){const letter=pickRand(letters,tgt&&tgt.letter);tgt={letter};setTarget(null);
      $('#stage').innerHTML=`<div class="bubble pop" style="${bubbleStyle(letter)}">${letter}</div><p class="say">Press any ${letter}</p>`;
      say(S.round===0?HINT[letter]:'Find '+(letters.length===1?'another':'a')+' '+letter+'.',ex);}
    else{const m=S.round===0&&d.first!=null?d.first:pickRand(d.pool,tgt&&tgt.m);tgt={m,letter:letterOf(m)};setTarget(m);
      $('#stage').innerHTML=`<div class="bubble pop" style="${bubbleStyle(letterOf(m))}">${letterOf(m)}</div><p class="say">Press the glowing key</p>`;
      say(m===60&&S.round===0?'This is middle C, right in the middle of the piano.':'Now find '+letterOf(m)+'.',ex);}}
  const handler=m=>{const ok=d.anyOct?(!isBlack(m)&&letterOf(m)===tgt.letter):m===tgt.m;const key=d.anyOct?tgt.letter:fullName(tgt.m);
    if(ok){good(m,key);S.round++;S.onNote=null;setTimeout(()=>{if(L!==S)return;S.onNote=handler;next();},450);}
    else{wrong++;const tl=tgt.letter;
      let msg=`That's ${isBlack(m)?'a black key':'a '+letterOf(m)}. We're looking for ${tl}.`;
      if(ex)msg+=` Try the ${COL_NAME[tl]} key.`;else if(d.anyOct)msg+=' '+HINT[tl];else msg+=m<tgt.m?' Go a little higher.':' Go a little lower.';
      bad(m,key,msg);
      if(d.anyOct&&wrong>=2){let best=null;for(let k=48;k<=84;k++)if(!isBlack(k)&&letterOf(k)===tl&&(best==null||Math.abs(k-m)<Math.abs(best-m)))best=k;setTarget(best);}}};
  S.onNote=handler;next();};

ENGINES.read=function(S){const d=S.def;const p=P();const ex=isEx();S.total=S.opts.rounds||(ex?Math.min(8,d.rounds):d.rounds);let tgt=null,wrong=0;const pool=S.opts.pool||d.pool;
  function draw(){$('#stage').innerHTML=staffSVG(tgt,p.colours)+`<p class="say">Play this note</p><div class="tog"><button class="chip" id="colTog" aria-pressed="${p.colours}">Coloured notes</button></div>`;
    $('#colTog').onclick=()=>{p.colours=!p.colours;save();draw();};}
  function next(){if(S.round>=S.total)return finish(S.total/(S.total+S.mistakes));dots(S.total,S.round);wrong=0;setTarget(null);
    tgt=pickRand(pool,tgt);draw();say(S.round===0?'Find this note on the keyboard. Middle C has a red dot.':'What note is this?',ex&&S.round===0);}
  const handler=m=>{const key=fullName(tgt);
    if(m===tgt){good(m,key,buddyLine('yay')+` That was ${letterOf(m)}.`);S.round++;S.onNote=null;setTimeout(()=>{if(L!==S)return;S.onNote=handler;next();},500);}
    else{wrong++;let msg;
      if(!isBlack(m)&&letterOf(m)===letterOf(tgt))msg=`Right letter! Now try the ${letterOf(tgt)} ${m<tgt?'higher up':'lower down'}.`;
      else msg=`That's ${isBlack(m)?'a black key':'a '+letterOf(m)}. `+(m<tgt?'Go higher.':'Go lower.');
      if(wrong>=2){setTarget(tgt);msg=`It's ${letterOf(tgt)}. Press the glowing key.`;}
      bad(m,key,msg);}};
  S.onNote=handler;next();};

function staffSVG(m,coloured){const top=60,sp=16,bottom=top+4*sp;const x=190;const st=stepOf(m);const y=bottom-(st-30)*sp/2;
  let s=`<svg class="staff" viewBox="0 28 300 136" role="img" aria-label="A note on the staff">`;
  for(let i=0;i<5;i++)s+=`<line class="ln" x1="12" x2="288" y1="${top+i*sp}" y2="${top+i*sp}"/>`;
  s+=`<path class="clef" d="${CLEF_PATH}" transform="translate(14 ${bottom}) scale(${sp/250} ${-sp/250})"/>`;
  for(let ls=28;ls>=st;ls-=2){const ly=bottom-(ls-30)*sp/2;s+=`<line class="ln" x1="${x-20}" x2="${x+20}" y1="${ly}" y2="${ly}"/>`;}
  for(let ls=40;ls<=st;ls+=2){const ly=bottom-(ls-30)*sp/2;s+=`<line class="ln" x1="${x-20}" x2="${x+20}" y1="${ly}" y2="${ly}"/>`;}
  const fill=coloured?colOf(m):'var(--ink)';
  if(st>=34)s+=`<line x1="${x-10}" x2="${x-10}" y1="${y}" y2="${y+52}" stroke="${fill}" stroke-width="3"/>`;else s+=`<line x1="${x+10}" x2="${x+10}" y1="${y}" y2="${y-52}" stroke="${fill}" stroke-width="3"/>`;
  s+=`<ellipse cx="${x}" cy="${y}" rx="11.5" ry="8.5" transform="rotate(-20 ${x} ${y})" fill="${fill}"/></svg>`;return s;}

ENGINES.rhythm=function(S){const d=S.def;const pats=S.opts.patterns||d.patterns;S.total=pats.length;let score=0;let R=null;let raf=0;let timer=0;const ex=isEx();
  const LABEL={0.5:'ti',1:'ta',2:'ta-a',3:'ta-a-a',4:'ta-a-a-a'};
  function layout(){const pat=pats[S.round];const beats=pat.reduce((a,b)=>a+b,0);let x=0;
    let h=`<div class="count" id="count"></div><div class="rwrap"><div class="rtrack" id="rtrack">`;
    for(let b=0;b<=beats;b++)h+=`<div class="rgrid${b%4===0?' rbar':''}" style="left:${b/beats*100}%"></div>`;
    pat.forEach((du,i)=>{h+=`<div class="rblock" id="rb${i}" style="left:calc(${x/beats*100}% + 5px);width:calc(${du/beats*100}% - 10px)">${LABEL[du]||''}</div>`;x+=du;});
    h+=`<div class="playhead" id="ph"></div></div></div><div class="row center"><button class="btn big" id="goBtn">Start</button></div>`;
    $('#stage').innerHTML=h;$('#goBtn').onclick=()=>begin();return beats;}
  function next(){if(S.round>=S.total)return finish(score/S.total,[['Rhythm',word(score/S.total)],['Timing tip',tipText()]]);dots(S.total,S.round);R={phase:'wait',beats:layout()};
    say(S.round===0?'Listen to the 4 clicks, then press any key at the start of each block.':'Ready? Tap Start or press a key.',ex&&S.round===0);}
  let early=0,late=0;
  const tipText=()=>early>late+2?'Wait for the beat':late>early+2?'Press right on the beat':'Nice and steady';
  function begin(){if(!R||R.phase!=='wait')return;const c=ac();const bpm=SPEEDS[P().speed].bpm;const beat=60/bpm;
    const lead=0.35;const now=performance.now();const aStart=c?c.currentTime+lead:0;const lat=c?((c.outputLatency||c.baseLatency||0)*1000):0;
    R.beatMs=beat*1000;R.t0=now+lead*1000+lat+4*R.beatMs;R.phase='run';R.presses=[];
    if(c)for(let i=0;i<4+R.beats;i++)click(aStart+i*beat,i%4===0);
    R.end=R.t0+R.beats*R.beatMs+450;$('#goBtn').style.visibility='hidden';$('#ph').style.display='block';say('Get ready...');tick();}
  function tick(){if(L!==S||!R||R.phase!=='run')return;const now=performance.now();const cnt=$('#count');
    if(now<R.t0){const b=Math.floor((now-(R.t0-4*R.beatMs))/R.beatMs)+1;cnt.textContent=b>=1?b:'';$('#ph').style.left='0%';}
    else{cnt.textContent='';$('#ph').style.left=Math.min(100,(now-R.t0)/R.beatMs/R.beats*100)+'%';}
    if(now>R.end){evaluate();return;}raf=requestAnimationFrame(tick);}
  function evaluate(){R.phase='done';const pat=pats[S.round];let st=0,sum=0;const used=new Set(),diffs=[];
    pat.forEach((du,i)=>{const T=R.t0+st*R.beatMs;st+=du;let best=-1,bd=1e9;R.presses.forEach((t,j)=>{if(used.has(j))return;const df=Math.abs(t-T);if(df<bd){bd=df;best=j;}});
      const el=$('#rb'+i);if(best>=0&&bd<=Math.min(300,R.beatMs*0.45)){used.add(best);const dt=R.presses[best]-T;diffs.push(dt);statTiming(dt);if(dt<-60)early++;else if(dt>60)late++;
        if(bd<=120){sum+=1;el.classList.add('perfect');Combo.hit();}else{sum+=0.7;el.classList.add('good');Combo.hit();}}else{el.classList.add('miss');Combo.miss();}});
    const extra=R.presses.length-used.size;S.mistakes+=extra;
    const rs=Math.max(0,(sum-0.5*extra)/pat.length);score+=rs;

    let msg=rs>=0.9?buddyLine('yay')+' Right on the beat!':rs>=0.6?'Nearly! ':'Nice try! ';
    if(rs<0.9)msg+=Math.abs(avg)>70?(avg<0?'Just a tiny bit early. Wait for the beat...':'A tiny bit late. Press right on the beat.'):(extra>0?'Press once for each block.':'Listen for the clicks.');

  S.stop=()=>{cancelAnimationFrame(raf);clearTimeout(timer);if(R)R.phase='stopped';};
  next();};

ENGINES.song=function(S){const d=S.def;const all=parseSong(d.notes);const notes=S.opts.limit?all.slice(0,S.opts.limit):all;let i=0;let showKeys=true;let listening=false;let lt=[];const p=P();const ex=isEx();
  S.total=notes.length;const ss=p.stats.songs[d.id]||(p.stats.songs[d.id]=[0,0]);ss[0]++;save();
  $('#stage').innerHTML=`<div class="train" id="train"><div class="train-inner" id="tin">${
    notes.map((n,k)=>`<div class="nb${letterOf(n.m)==='E'?' dark':''}" id="nb${k}" style="--c:${colOf(n.m)};width:${Math.max(56,40+n.d*26)}px">${letterOf(n.m)}</div>`).join('')
  }</div></div><div class="tog"><button class="btn ghost" id="lisBtn">Listen first</button><button class="chip" id="keyTog" aria-pressed="true">Show keys</button></div>`;
  function paint(){notes.forEach((n,k)=>{const e=$('#nb'+k);if(!e)return;e.classList.toggle('done',k<i);e.classList.toggle('now',k===i);});
    const cur=$('#nb'+Math.min(i,notes.length-1));const tr=$('#train');if(cur&&tr){const off=cur.offsetLeft-tr.clientWidth*0.3;$('#tin').style.transform=`translateX(${-Math.max(0,off)}px)`;}
    setTarget(showKeys&&!listening&&i<notes.length?notes[i].m:null);$('#lDots').innerHTML=`<span style="font-size:18px;font-weight:700;color:var(--muted)">${Math.min(i,notes.length)} of ${notes.length} notes</span>`;}

    say('Listen to the tune. Then it is your turn.',ex);setTarget(null);
    notes.forEach((n,k)=>{tone(n.m,t,Math.min(1.2,n.d*beat*0.95),0.2,musicBus);lt.push(setTimeout(()=>{i=k;paint();},(t-c.currentTime)*1000));t+=n.d*beat;});
    lt.push(setTimeout(()=>{listening=false;i=keep;paint();say('Your turn! Play the glowing notes.',ex);},(t-c.currentTime)*1000+300));};

    if(m===exp){flash(m,'good');Combo.hit();statNote(fullName(exp),true);i++;paint();
      if(i>=notes.length){ss[1]++;if(!S.opts.limit)addRecent('Played all of '+d.title);say(S.opts.limit?'Lovely! That was the first part.':'You played the whole song!',ex);react('yay');setTimeout(()=>{if(L===S)finish(notes.length/(notes.length+S.mistakes),[['Notes',word(notes.length/(notes.length+S.mistakes))],['Song',S.opts.limit?'First part':'All of it!']]);},700);}
      else if(i%8===0){say(buddyLine('yay'));react('yay');}}
    else{bad(m,fullName(exp),`Oops, that's ${isBlack(m)?'a black key':'a '+letterOf(m)}. Try ${letterOf(exp)}`+(ex?`, the ${COL_NAME[letterOf(exp)]} key.`:'.'));}};
  S.stop=()=>{lt.forEach(clearTimeout);lt=[];listening=false;};
  say(ex?'Play the glowing keys. Tap Listen first to hear it.':'Tap Listen first to hear it, or start playing the glowing keys.',ex);requestAnimationFrame(paint);};

/* ================= Beat City ================= */
function startBeat(def,opts){stopAll();opts=opts||{};const p=P();const ex=isEx();
  let pat=def.pattern.split('');if(opts.beats)pat=pat.slice(0,opts.beats);const N=pat.length;
  const S=L={def,opts,onDone:opts.onDone,mistakes:0};Combo.reset();
  document.documentElement.style.setProperty('--wc',def.world.color);
  $('#bTitle').textContent=opts.title||def.title;
  $('#bStage').innerHTML=`${buddyHTML(p.buddy,'','beatBuddy').replace('class="buddy ','class="buddy beat-buddy ')}<div style="display:flex;flex-direction:column;align-items:center;gap:10px"><div class="ringbox"><div class="approach" id="appr" style="opacity:0"></div><div class="target" id="tgt">${ICON.note}</div></div><div class="beatword" id="bword">${def.tip}</div><button class="btn big" id="bGo">Start</button></div>`;
  $('#bStrip').innerHTML=pat.map((c,k)=>`<i id="bs${k}" class="${c==='x'?'x':'r'}">${c==='-'?'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#4DB6E8" stroke-width="3" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></svg>':''}</i>`).join('');
  show('scr-beat');say('',false);speak(def.tip);
  const st={phase:'wait',judged:{},credit:0,held:0,rests:pat.filter(c=>c==='-').length,hits:pat.filter(c=>c==='x').length,lastBeat:-99,raf:0,bus:null};
  const bud=$('#beatBuddy'),tgt=$('#tgt'),appr=$('#appr'),bword=$('#bword');
  function begin(){if(st.phase!=='wait')return;const c=ac();if(!c)return;const bpm=(SPEEDS[p.speed]||SPEEDS.steady).beat;const beat=60/bpm;st.beatMs=beat*1000;
    const lead=0.4;const lat=(c.outputLatency||c.baseLatency||0)*1000;const aStart=c.currentTime+lead;st.t0=performance.now()+lead*1000+lat+4*st.beatMs;
    st.bus=c.createGain();st.bus.connect(musicBus);
    for(let i=0;i<4;i++){click(aStart+i*beat,i===0,st.bus);}
    for(let k=0;k<N;k++){const t=aStart+(4+k)*beat;const inBar=k%4;
      drum(inBar%2===0?'kick':'snare',t,st.bus);drum('hat',t,st.bus);drum('hat',t+beat/2,st.bus);
      if(inBar===0)bassNote(k%8===0?36:43,t,beat*1.6,st.bus);if(inBar===2)bassNote(k%8===2?40:38,t,beat*1.2,st.bus);}
    drum('kick',aStart+(4+N)*beat,st.bus);drum('crash',aStart+(4+N)*beat,st.bus);
    st.phase='run';$('#bGo').style.display='none';loop();}
  function beatPos(t){return (t-st.t0)/st.beatMs;}
  function mark(k,cls){const e=$('#bs'+k);if(e){e.classList.remove('x','r');e.classList.add(cls);}}
  function loop(){if(L!==S||st.phase!=='run')return;const now=performance.now();const b=beatPos(now);
    const cur=Math.floor(b+0.5);
    if(b<0){const n=Math.floor(b)+5;tgt.innerHTML=n>=1&&n<=4?`<span>${n}</span>`:ICON.note;tgt.classList.remove('freeze');}
    // approach ring for the next beat
    const nk=Math.ceil(b);const frac=nk-b;
    if(nk>=0&&nk<N){appr.style.opacity=1;appr.style.transform=`scale(${1+frac*0.75})`;appr.classList.toggle('freeze',pat[nk]==='-');}else appr.style.opacity=0;
    if(cur>=0&&cur<N&&b>=-0.5){tgt.classList.toggle('freeze',pat[cur]==='-');if(Math.abs(b-cur)<0.5)tgt.innerHTML=pat[cur]==='-'?SNOW:ICON.note;
      $$('#bStrip i.now').forEach(e=>e.classList.remove('now'));const se=$('#bs'+cur);if(se)se.classList.add('now');}
    // beat crossings: bump + dance
    const fb=Math.floor(b);if(fb!==st.lastBeat&&fb>=-4){st.lastBeat=fb;tgt.classList.add('bump');setTimeout(()=>tgt.classList.remove('bump'),110);
      bud.style.setProperty('--amp',1+Math.min(3,Math.floor(Combo.n/4)));bud.classList.toggle('beatL',fb%2===0);bud.classList.toggle('beatR',fb%2!==0);}
    // missed hits and held freezes
    for(let k=0;k<N;k++){if(st.judged[k]||b<k+0.5)continue;
      if(pat[k]==='x'){st.judged[k]='miss';mark(k,'miss');Combo.miss();S.mistakes++;}
      else{st.judged[k]='held';st.held++;mark(k,'held');Combo.hit();bword.textContent='Frozen! Nice.';}}
    if(b>N+0.8){end();return;}
    st.raf=requestAnimationFrame(loop);}
  function judge(t){const b=beatPos(t);const k=Math.round(b);const dt=(b-k)*st.beatMs;if(k<0||k>=N)return;
    if(pat[k]==='-'){if(Math.abs(dt)<=220&&!st.judged[k]){st.judged[k]='broke';mark(k,'broke');Combo.miss();S.mistakes++;bword.textContent='Freeze on the snowflake!';react('oops');}return;}
    if(st.judged[k])return;const a=Math.abs(dt);statTiming(dt);
    if(a<=90){st.judged[k]='ok';st.credit+=1;mark(k,'ok');Combo.hit();bword.textContent=pickRand(['Right on the beat!','Perfect timing!','Yes!']);}
    else if(a<=180){st.judged[k]='ok';st.credit+=0.75;mark(k,'ok');Combo.hit();bword.textContent='Nice!';}
    else if(a<=260){st.judged[k]='near';st.credit+=0.35;mark(k,'near');bword.textContent=dt<0?'Just a tiny bit early.':'A tiny bit late.';}
    else{bword.textContent=dt<0?'Wait for the beat...':'Catch the next one!';}}
  function end(){st.phase='done';cancelAnimationFrame(st.raf);const acc=(st.credit+st.held)/(st.hits+st.rests);
    const r=P().stats.rhythm;bud.classList.remove('beatL','beatR');
    const rows=[['Timing',word(st.credit/Math.max(1,st.hits))]];if(st.rests)rows.push(['Freezes',st.held+' of '+st.rests]);
    finish(acc,rows);}
  S.onNote=(m,t)=>{if(st.phase==='wait'){begin();return;}if(st.phase==='run')judge(t);};
  S.stop=()=>{cancelAnimationFrame(st.raf);st.phase='stopped';if(st.bus){try{st.bus.gain.setValueAtTime(0,actx.currentTime);st.bus.disconnect();}catch(e){}}};
  $('#bGo').onclick=begin;}

/* ================= Magic Piano ================= */
function startMagic(opts){stopAll();opts=opts||{};const p=P();
  const S=L={def:LESSONS.m1,opts,onDone:opts.onDone};
  show('scr-magic');$('#mBuddy').innerHTML=(BUDDIES[p.buddy]).svg;$('#mBuddy').className='buddy live';$('#mHint').style.opacity=.9;
  const cv=$('#mcan'),ctx=cv.getContext('2d');let W=0,H=0;const parts=[];const recent=[];let raf=0,lastNote=0,lastM=-1,started=0;
  function size(){const r=cv.getBoundingClientRect();const dpr=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
  size();window.addEventListener('resize',size);
  const bgStars=Array.from({length:40},()=>({x:Math.random(),y:Math.random()*0.7,r:Math.random()*1.6+0.4,p:Math.random()*6}));
  const xOf=m=>W*(0.08+0.84*Math.max(0,Math.min(1,(m-48)/36)));
  function add(o){if(parts.length>260)parts.shift();parts.push(o);}
  function star(x,y,r,rot){ctx.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5;const rr=i%2?r*0.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();ctx.fill();}
  function spawn(m){const c=isBlack(m)?'#C9A6FF':colOf(m);const x=xOf(m);
    if(m>=72){add({k:'star',x,y:H*(0.1+Math.random()*0.3),vx:0,vy:0,life:0,max:150,r:10+Math.random()*10,c,rot:Math.random()*6});}
    else if(m>=60){add({k:'bub',x,y:H*0.85,vx:(Math.random()-0.5)*0.4,vy:-1.4-Math.random(),life:0,max:170,r:12+Math.random()*12,c});}
    else{add({k:'wave',x,y:H*0.9,life:0,max:90,r:10,c});}
    if(m===lastM&&performance.now()-lastNote<700)for(let i=0;i<8;i++)add({k:'spark',x,y:H*0.6,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.8)*4,life:0,max:50,r:3,c:'#FFF3A0'});
    const now=performance.now();recent.push(now);while(recent.length&&now-recent[0]>90)recent.shift();
    if(recent.length>=3){for(let i=0;i<50;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*5;add({k:'spark',x:W/2,y:H*0.45,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0,max:70,r:3+Math.random()*3,c:Object.values(NOTE_COL)[i%7]});}recent.length=0;react('yay');}
    lastM=m;lastNote=now;}
  function frame(){if(L!==S)return;ctx.clearRect(0,0,W,H);const t=performance.now()/1000;
    bgStars.forEach(s=>{ctx.globalAlpha=0.35+0.35*Math.sin(t+s.p);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,7);ctx.fill();});
    for(let i=parts.length-1;i>=0;i--){const o=parts[i];o.life++;const k=1-o.life/o.max;if(k<=0){parts.splice(i,1);continue;}ctx.globalAlpha=Math.min(1,k*1.5);ctx.fillStyle=o.c;ctx.strokeStyle=o.c;
      if(o.k==='star'){star(o.x,o.y,o.r*(0.8+0.2*Math.sin(o.life/6)),o.rot);}
      else if(o.k==='bub'){o.x+=o.vx+Math.sin(o.life/12)*0.6;o.y+=o.vy;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill();ctx.globalAlpha*=0.6;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(o.x-o.r*0.35,o.y-o.r*0.35,o.r*0.25,0,7);ctx.fill();}
      else if(o.k==='wave'){ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(o.x,o.y,o.r+o.life*2.2,(o.r+o.life*2.2)*0.28,0,0,7);ctx.stroke();}
      else{o.x+=o.vx;o.y+=o.vy;o.vy+=0.06;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill();}}
    ctx.globalAlpha=1;
    const busy=performance.now()-lastNote<1500;$('#mBuddy').classList.toggle('dance',busy);
    if(opts.seconds&&started){const el=(performance.now()-started)/1000;$('#mTimer').style.setProperty('--p',Math.min(100,el/opts.seconds*100));if(el>=opts.seconds){S.done=true;cancelAnimationFrame(raf);S.onDone&&S.onDone({acc:1,stars:3});return;}}
    raf=requestAnimationFrame(frame);}
  $('#mTimer').hidden=!opts.seconds;
  S.onNote=m=>{if(!started)started=performance.now();$('#mHint').style.opacity=0;spawn(m);};
  S.stop=()=>{cancelAnimationFrame(raf);window.removeEventListener('resize',size);$('#mBuddy').classList.remove('dance');};
  speak(isEx()?'This is the Magic Piano. Play anything you like!':'');frame();}

let ADVgo=null;
function advState(p){if(p.adv.date!==today())return{step:0,done:false};return{step:p.adv.step,done:p.adv.step>=5};}
function firstNotMastered(p,ids){return ids.find(id=>(p.stars[id]||0)<3)||ids[ids.length-1];}
function buildAdventure(p){
  const songId=firstNotMastered(p,['s1','s2','s3','s4','s5','s6','s7','s8']);const song=LESSONS[songId];
  if(p.stage==='explorer')return [
    {icon:'keys',color:'#FF8A3D',title:'Find 3 Cs',run:done=>startLesson(LESSONS.k2,{rounds:3,letters:['C'],title:'Find 3 Cs',onDone:done})},
    {icon:'beat',color:'#E8458B',title:'Beat Bounce',run:done=>startBeat(LESSONS.b1,{beats:12,onDone:done})},
    {icon:'glow',color:'#FF8A3D',title:'Glowing keys',run:done=>startLesson(LESSONS.k1,{rounds:5,title:'Glowing keys',onDone:done})},
    {icon:'castle',color:'#9B5DE5',title:'A bit of '+song.title,run:done=>startLesson(song,{limit:8,onDone:done})},
    {icon:'magic',color:'#6A4CFF',title:'Magic Piano',run:done=>startMagic({seconds:30,onDone:done})}];
  const readId=firstNotMastered(p,['n1','n2','n3','n4']);const rId=firstNotMastered(p,['r1','r2','r3','r4']);const bId=(p.stars.b1||0)>=2?((p.stars.b2||0)>=2?'b3':'b2'):'b1';
  return [
    {icon:'keys',color:'#FF8A3D',title:'Letter hunt',run:done=>startLesson(LESSONS.k3,{rounds:6,onDone:done})},
    {icon:'flower',color:'#23A160',title:'Read 5 notes',run:done=>startLesson(LESSONS[readId],{rounds:5,title:'Read 5 notes',onDone:done})},
    {icon:'wave',color:'#4D7CFE',title:'Rhythm river',run:done=>startLesson(LESSONS[rId],{patterns:LESSONS[rId].patterns.slice(0,2),onDone:done})},
    {icon:'castle',color:'#9B5DE5',title:'Part of '+song.title,run:done=>startLesson(song,{limit:Math.ceil(parseSong(song.notes).length/2),onDone:done})},
    {icon:'beat',color:'#E8458B',title:LESSONS[bId].title,run:done=>startBeat(LESSONS[bId],{onDone:done})}];}
function startAdventure(){const p=P();if(p.adv.date!==today())p.adv={date:today(),step:0};save();advInterstitial(buildAdventure(p));}
function advInterstitial(steps){const p=P();const i=p.adv.step;
  if(i>=steps.length)return advComplete();const s=steps[i];stopAll();
  document.documentElement.style.setProperty('--wc',s.color);
  $('#advCard').innerHTML=`${buddyHTML(p.buddy,'live')}<div class="advpath">${steps.map((_,k)=>`<i class="${k<i?'d':k===i?'c':''}"></i>`).join('')}</div>
   <div class="stepicon">${ICON[s.icon]}</div><h2>${s.title}</h2><p>${i===0?"Today's adventure has 5 steps.":'Step '+(i+1)+' of 5'}</p>
   <div class="row"><button class="btn ghost" id="advLater">Later</button><button class="btn big" id="advGo">Go!</button></div><p style="font-size:17px;margin-top:10px">Or press any key on your piano</p>`;
  $('#advOv').hidden=false;speak((i===0?"Today's adventure! ":'')+s.title+'. Press any key to go!');
  ADVgo=()=>{ADVgo=null;$('#advOv').hidden=true;s.run(()=>{p.adv.step=i+1;save();setTimeout(()=>advInterstitial(steps),600);});};
  $('#advGo').onclick=()=>ADVgo&&ADVgo();$('#advLater').onclick=()=>{ADVgo=null;$('#advOv').hidden=true;renderMap();};}
function advComplete(){const p=P();stopAll();let fresh=false,stk=null;

   <p>See you tomorrow for a new adventure.</p><div class="row"><button class="btn big" id="advDone">Back to map</button></div>`;
  $('#advOv').hidden=false;fanfare();confetti();react('yay');speak('Adventure complete! '+(fresh?'You won a new sticker!':''));

function childReport(id){const p=DB.profiles[id];const st=p.stats;
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');days.push([d.toLocaleDateString('en-GB',{weekday:'short'}),Math.round((st.days[k]||0)/60)]);}
  const maxM=Math.max(5,...days.map(d=>d[1]));const week=days.reduce((a,d)=>a+d[1],0);
  const byL={};Object.entries(st.notes).forEach(([k,[h,m]])=>{const l=k[0];const e=byL[l]||(byL[l]=[0,0]);e[0]+=h;e[1]+=m;});
  const letters='CDEFGAB'.split('').filter(l=>byL[l]&&byL[l][0]+byL[l][1]>=3);
  const weak=letters.filter(l=>byL[l][1]/(byL[l][0]+byL[l][1])>0.25);const strong=letters.filter(l=>!weak.includes(l));
  const r=st.rhythm;const rn=r.early+r.late+r.on;const rt=rn<8?'Not enough rhythm play yet.':r.early>r.late*1.6&&r.early>rn*0.25?'Tends to rush a little (plays before the beat). Freeze Beat helps with this.':r.late>r.early*1.6&&r.late>rn*0.25?'Tends to come in a little late.':'Timing is balanced. '+Math.round(r.on/rn*100)+'% of beats landed right on time.';
  const songs=WORLDS.find(w=>w.id==='songs').lessons.map(l=>[l.title,st.songs[l.id]]).filter(x=>x[1]);
  return `<div class="pcard"><h3>Practice this week: ${week} minutes</h3><div class="bars">${days.map(([d,m])=>`<div><span style="height:${m/maxM*100}%"></span>${d}</div>`).join('')}</div></div>
   <div class="pcard"><h3>Notes</h3>${letters.length?`<div class="lrow">${strong.map(l=>`<span class="s">${l}: strong</span>`).join('')}${weak.map(l=>`<span class="w">${l}: needs practice</span>`).join('')}</div>`:'<p>Not enough note games yet.</p>'}</div>
   <div class="pcard"><h3>Rhythm</h3><p>${rt}</p></div>
   <div class="pcard"><h3>Songs</h3>${songs.length?`<div class="kv">${songs.map(([t,[a,d]])=>`<b>${t}</b><span>tried ${a} time${a===1?'':'s'}, finished ${d}</span>`).join('')}</div>`:'<p>No songs tried yet.</p>'}</div>
   <div class="pcard"><h3>Recent achievements</h3>${st.recent.length?`<ul>${st.recent.slice(0,8).map(a=>`<li>${a.t} <span style="color:var(--muted)">(${a.d})</span></li>`).join('')}</ul>`:'<p>Nothing yet.</p>'}<p>Stars: ${totalStars(p)}. Stickers: ${p.stickers.length}. Best combo: ${st.bestCombo}. Daily adventures done: ${p.advDays.length}.</p></div>`;}

/* ================= practice time ================= */
setInterval(()=>{const p=P();if(!p||document.visibilityState!=='visible')return;if(performance.now()-lastInput>30000)return;const k=today();p.stats.days[k]=(p.stats.days[k]||0)+5;save();},5000);

/* ================= boot ================= */
buildKB();setPill(navigator.requestMIDIAccess?'idle':'none');renderHome();
window.addEventListener('resize',()=>{if(document.body.classList.contains('kbon'))centreKB();});
})();

</script>
